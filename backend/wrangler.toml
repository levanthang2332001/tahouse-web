database_name = "tahouseta"
database_id = "12656177-18a7-42c2-b421-42776a7530ed"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tahouse"

[vars]
NODE_ENV = "production"
R2_ACCOUNT_ID = "01e798a646dcdb5e2fc7c86ff1c7907f"
R2_BUCKET_NAME = "tahouse"
R2_PUBLIC_URL = "https://pub-e5d9624d0e30443e9355576fdab7d40a.r2.dev"
